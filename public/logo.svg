<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing background -->
  <circle cx="256" cy="256" r="256" fill="url(#paint0_radial)"/>

  <!-- Main circle with gradient border -->
  <circle cx="256" cy="256" r="230" fill="black" stroke="url(#paint1_linear)" stroke-width="12"/>

  <!-- JE Letters -->
  <g>
    <!-- J Letter -->
    <path d="M176 128V272C176 292 184 308 200 324C216 340 240 340 256 340"
      stroke="url(#paint2_linear)" stroke-width="24" stroke-linecap="round"/>

    <!-- E Letter -->
    <path d="M272 128V340H352" stroke="url(#paint3_linear)" stroke-width="24" stroke-linecap="round"/>
    <path d="M272 234H336" stroke="url(#paint4_linear)" stroke-width="24" stroke-linecap="round"/>
    <path d="M272 128H352" stroke="url(#paint5_linear)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="256" cy="256" r="120" stroke="url(#paint6_linear)" stroke-width="4" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- Animated particles -->
  <g>
    <circle cx="180" cy="180" r="8" fill="url(#paint7_linear)">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="332" cy="180" r="8" fill="url(#paint8_linear)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;10;8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="150" r="10" fill="url(#paint9_linear)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;12;10" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="332" r="7" fill="url(#paint10_linear)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="312" cy="332" r="7" fill="url(#paint11_linear)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;9;7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="180" fill="url(#paint12_radial)" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(256)">
      <stop offset="0.7" stop-color="#000000"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="paint1_linear" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint2_linear" x1="176" y1="128" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint3_linear" x1="272" y1="128" x2="352" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint4_linear" x1="272" y1="234" x2="336" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint5_linear" x1="272" y1="128" x2="352" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint6_linear" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint7_linear" x1="174" y1="174" x2="186" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint8_linear" x1="326" y1="174" x2="338" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint9_linear" x1="248" y1="142" x2="264" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint10_linear" x1="195" y1="327" x2="205" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint11_linear" x1="307" y1="327" x2="317" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <radialGradient id="paint12_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(180)">
      <stop offset="0.6" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
</svg>
