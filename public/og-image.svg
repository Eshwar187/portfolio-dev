<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with radial gradient -->
  <rect width="1200" height="630" fill="#000000"/>
  <circle cx="300" cy="315" r="300" fill="url(#paint0_radial)" opacity="0.4"/>

  <!-- Stars Background -->
  <g opacity="0.6">
    <!-- Small stars -->
    <circle cx="100" cy="100" r="1" fill="white"/>
    <circle cx="200" cy="150" r="1" fill="white"/>
    <circle cx="300" cy="200" r="1" fill="white"/>
    <circle cx="400" cy="100" r="1" fill="white"/>
    <circle cx="500" cy="300" r="1" fill="white"/>
    <circle cx="600" cy="200" r="1" fill="white"/>
    <circle cx="700" cy="100" r="1" fill="white"/>
    <circle cx="800" cy="400" r="1" fill="white"/>
    <circle cx="900" cy="200" r="1" fill="white"/>
    <circle cx="1000" cy="300" r="1" fill="white"/>
    <circle cx="1100" cy="150" r="1" fill="white"/>

    <!-- Medium stars -->
    <circle cx="150" cy="250" r="1.5" fill="white"/>
    <circle cx="350" cy="350" r="1.5" fill="white"/>
    <circle cx="550" cy="150" r="1.5" fill="white"/>
    <circle cx="750" cy="250" r="1.5" fill="white"/>
    <circle cx="950" cy="350" r="1.5" fill="white"/>
    <circle cx="1150" cy="250" r="1.5" fill="white"/>

    <!-- Large stars -->
    <circle cx="250" cy="450" r="2" fill="white"/>
    <circle cx="450" cy="550" r="2" fill="white"/>
    <circle cx="650" cy="450" r="2" fill="white"/>
    <circle cx="850" cy="550" r="2" fill="white"/>
    <circle cx="1050" cy="450" r="2" fill="white"/>
  </g>

  <!-- Main circle with gradient border -->
  <circle cx="300" cy="315" r="150" fill="black" stroke="url(#paint1_linear)" stroke-width="8"/>

  <!-- JE Letters -->
  <g>
    <!-- J Letter -->
    <path d="M220 215V315C220 335 228 345 240 360C252 375 275 375 300 375"
      stroke="url(#paint2_linear)" stroke-width="16" stroke-linecap="round"/>

    <!-- E Letter -->
    <path d="M320 215V375H380" stroke="url(#paint3_linear)" stroke-width="16" stroke-linecap="round"/>
    <path d="M320 295H370" stroke="url(#paint4_linear)" stroke-width="16" stroke-linecap="round"/>
    <path d="M320 215H380" stroke="url(#paint5_linear)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="300" cy="315" r="80" stroke="url(#paint6_linear)" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Animated particles -->
  <g>
    <circle cx="250" cy="265" r="4" fill="url(#paint7_linear)"/>
    <circle cx="350" cy="265" r="4" fill="url(#paint8_linear)"/>
    <circle cx="300" cy="245" r="5" fill="url(#paint9_linear)"/>
    <circle cx="260" cy="365" r="3" fill="url(#paint10_linear)"/>
    <circle cx="340" cy="365" r="3" fill="url(#paint11_linear)"/>
  </g>

  <!-- Glow effect -->
  <circle cx="300" cy="315" r="120" fill="url(#paint12_radial)" opacity="0.1"/>

  <!-- Name and Title -->
  <path d="M500 260 L520 260 L520 300 L560 300 L560 260 L580 260 L580 360 L560 360 L560 320 L520 320 L520 360 L500 360 Z" fill="white"/>
  <path d="M600 260 L680 260 L680 280 L620 280 L620 300 L670 300 L670 320 L620 320 L620 340 L680 340 L680 360 L600 360 Z" fill="white"/>
  <path d="M700 260 L720 260 L720 340 L770 340 L770 360 L700 360 Z" fill="white"/>
  <path d="M790 260 L810 260 L810 300 L850 300 L850 260 L870 260 L870 360 L850 360 L850 320 L810 320 L810 360 L790 360 Z" fill="white"/>
  <path d="M890 260 L910 260 L910 340 L960 340 L960 360 L890 360 Z" fill="white"/>
  <path d="M980 260 L1000 260 L1000 300 L1040 300 L1040 260 L1060 260 L1060 360 L1040 360 L1040 320 L1000 320 L1000 360 L980 360 Z" fill="white"/>

  <text x="500" y="400" font-family="Arial, sans-serif" font-size="36" fill="url(#paint13_linear)">Full-Stack Developer</text>

  <!-- Decorative Line -->
  <line x1="500" y1="430" x2="900" y2="430" stroke="url(#paint14_linear)" stroke-width="3"/>

  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 315) rotate(90) scale(300)">
      <stop offset="0.5" stop-color="#000000"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="paint1_linear" x1="180" y1="195" x2="420" y2="435" gradientUnits="userSpaceOnUse">
