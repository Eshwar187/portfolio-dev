      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint2_linear" x1="220" y1="215" x2="300" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint3_linear" x1="320" y1="215" x2="380" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint4_linear" x1="320" y1="295" x2="370" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint5_linear" x1="320" y1="215" x2="380" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint6_linear" x1="240" y1="255" x2="360" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint7_linear" x1="246" y1="261" x2="254" y2="269" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint8_linear" x1="346" y1="261" x2="354" y2="269" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint9_linear" x1="295" y1="240" x2="305" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint10_linear" x1="257" y1="362" x2="263" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint11_linear" x1="337" y1="362" x2="343" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <radialGradient id="paint12_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 315) rotate(90) scale(120)">
      <stop offset="0.6" stop-color="#8A2BE2" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="paint13_linear" x1="500" y1="400" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
    <linearGradient id="paint14_linear" x1="500" y1="430" x2="900" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF00FF"/>
    </linearGradient>
  </defs>
</svg>
